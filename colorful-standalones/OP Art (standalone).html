  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

================\n   OP — stylesheet\n   A clinical, immaculate skeleton. Op Art is mathematical; the chrome should\n   be too. Helvetica for the museum labels, IBM Plex Mono for the readouts.\n   The fields supply all the colour; the interface stays neutral.\n   =========================================================================== */\n\n:root{\n  --paper:#f1efe9;\n  --ink:#0d0d0c;\n  --grey:#8f8c84;\n  --hair:rgba(13,13,12,.16);\n  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;\n  --sans:'Helvetica Neue', Helvetica, Arial, sans-serif;\n  --emph:.65;\n  --bar:54px;\n}\n\n*{ box-sizing:border-box; }\nhtml,body{ margin:0; }\nhtml{\n  background:var(--paper); color:var(--ink);\n  font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;\n  scroll-behavior:smooth;\n  scroll-padding-top:var(--bar);\n  overflow-x:clip;\n}\n@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }\nbody{ overflow:visible; }\nmain{ scroll-snap-type:y proximity; }\nimg,svg,canvas{ display:block; }\n::selection{ background:var(--ink); color:var(--paper); }\n\n/* ── chrome: topbar ─────────────────────────────────────────────────────── */\n.topbar{\n  position:fixed; inset:0 0 auto 0; height:var(--bar); z-index:60;\n  display:flex; align-items:center; justify-content:space-between;\n  padding:0 clamp(14px,3vw,30px);\n  background:color-mix(in srgb, var(--paper) 82%, transparent);\n  backdrop-filter:blur(10px) saturate(1.1);\n  border-bottom:1px solid var(--hair);\n}\n.brand{ display:flex; align-items:baseline; gap:12px; text-decoration:none; color:var(--ink); }\n.brand b{ font-size:19px; letter-spacing:.02em; }\n.brand span{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); }\n@media (max-width:640px){ .brand span{ display:none; } }\n.ops{ display:flex; align-items:center; gap:clamp(12px,2.4vw,26px); }\n.dial{ display:flex; align-items:center; gap:10px; }\n.dial label{ font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--grey); }\n.dial output{ font-family:var(--mono); font-size:12px; width:2.6ch; text-align:right; }\n.calm{\n  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;\n  background:none; border:1px solid var(--hair); color:var(--ink);\n  padding:7px 12px; border-radius:1px; cursor:pointer; transition:.18s;\n}\n.calm:hover{ border-color:var(--ink); }\n.calm.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }\n\n/* clinical range input */\ninput[type=range]{\n  -webkit-appearance:none; appearance:none; height:2px; background:var(--ink);\n  border-radius:0; outline:none; cursor:ew-resize;\n}\n.dial input[type=range]{ width:clamp(80px,12vw,150px); }\ninput[type=range]::-webkit-slider-thumb{\n  -webkit-appearance:none; width:13px; height:13px; background:var(--paper);\n  border:2px solid var(--ink); border-radius:0;\n}\ninput[type=range]::-moz-range-thumb{ width:11px; height:11px; background:var(--paper); border:2px solid var(--ink); border-radius:0; }\n\n/* ── room index (bottom-centre rail) ───────────────────────────────────── */\n.idx{\n  position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:55;\n  display:flex; flex-direction:row; gap:4px; align-items:center;\n  background:color-mix(in srgb, var(--paper) 78%, transparent);\n  backdrop-filter:blur(8px); border:1px solid var(--hair); border-radius:2px;\n  padding:6px 8px;\n}\n.idx a{\n  display:flex; align-items:center; gap:7px; text-decoration:none; color:var(--grey);\n  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;\n  padding:4px 7px; opacity:.7; transition:.22s; border-radius:1px;\n}\n.idx a i{ width:6px; height:6px; border:1px solid currentColor; border-radius:50%; transition:.22s; flex:none; }\n.idx a b{ font-weight:500; }\n.idx a em{ font-style:normal; text-transform:uppercase; max-width:0; overflow:hidden; white-space:nowrap; opacity:0; transition:.28s; }\n.idx a:hover{ opacity:1; color:var(--ink); }\n.idx a:hover em{ max-width:140px; opacity:1; }\n.idx a.on{ opacity:1; color:var(--ink); }\n.idx a.on i{ background:currentColor; }\n.idx a.on em{ max-width:140px; opacity:1; }\n@media (max-width:640px){ .idx a em{ display:none; } .idx{ bottom:10px; } }\n\n.rm-banner{\n  position:fixed; bottom:0; left:0; right:0; z-index:55;\n  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;\n  text-align:center; padding:8px; background:var(--ink); color:var(--paper);\n}\n\n/* ── emergent stripe-letter titles ─────────────────────────────────────── */\n.emergent{ width:100%; height:auto; opacity:var(--emph); transition:opacity .3s; }\n.stripe-ink{ fill:var(--ink); }\n.plain-title{ display:none; font-weight:800; letter-spacing:-.02em; line-height:.9; margin:0; }\nhtml[data-type=\"clinical\"] .title .emergent{ display:none; }\nhtml[data-type=\"clinical\"] .plain-title{ display:block; }\n\n/* ── hero / entrance ────────────────────────────────────────────────────── */\n.hero{\n  min-height:100svh; display:flex; align-items:center;\n  padding:calc(var(--bar) + 4vh) clamp(20px,6vw,90px) 6vh;\n  scroll-snap-align:start;\n}\n.hero-in{ max-width:760px; }\n.kicker{ font-family:var(--mono); font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--grey); margin-bottom:clamp(14px,3vh,30px); }\n.hero-title{ width:auto; margin-bottom:clamp(18px,4vh,40px); }\n.hero-title .emergent{ width:auto; height:clamp(120px,25vh,250px); opacity:clamp(.62, calc(var(--emph) + .12), 1); }\n.thesis{ font-size:clamp(24px,3.6vw,44px); font-weight:600; line-height:1.08; letter-spacing:-.02em; margin:0 0 clamp(18px,3vh,30px); }\n.lede{ font-size:clamp(15px,1.5vw,18px); line-height:1.6; max-width:54ch; color:#2a2926; margin:0 0 clamp(20px,4vh,38px); text-wrap:pretty; }\n.care{ display:flex; gap:14px; align-items:flex-start; max-width:58ch; border-top:1px solid var(--hair); padding-top:18px; }\n.care .dot{ width: x solid var(--ink);\n  padding:11px 16px; border-radius:1px; cursor:pointer; transition:.16s;\n}\n.ctl:hover{ background:transparent; color:var(--ink); }\n.ctl:disabled{ opacity:.5; cursor:default; }\n.ctl.on{ background:transparent; color:var(--ink); }\n.ctl.big{ padding:14px 22px; font-size:13px; }\n\n/* full-bleed canvas stations (moiré, vega) */\n.fullbleed canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }\n.fullbleed .label{\n  position:absolute; z-index:3; padding:clamp(16px,3vw,30px); pointer-events:none;\n  background:color-mix(in srgb, var(--paper) 70%, transparent);\n  backdrop-filter:blur(4px); border:1px solid var(--hair); border-radius:2px;\n  margin:clamp(16px,3vw,34px);\n}\n.fullbleed .label *{ pointer-events:auto; }\n.label.bl{ left:0; bottom:0; }\n.label.tr{ right:0; top:var(--bar); }\n\n/* split stations (afterimage, contrast) */\n.split{ display:grid; grid-template-columns:1.15fr .85fr; align-items:center; gap:clamp(20px,4vw,60px);\n  padding:calc(var(--bar) + 5vh) clamp(20px,5vw,80px) 6vh; }\n@media (max-width:880px){ .split{ grid-template-columns:1fr; } }\n\n/* afterimage */\n.af-wrap{ display:flex; justify-content:center; }\n.stage{ position:relative; width:min(74vh,46vw,560px); aspect-ratio:1; max-width:92vw; border:1px solid var(--hair); }\n@media (max-width:880px){ .stage{ width:min(80vw,520px); } }\n.stage canvas{ width:100%; height:100%; opacity:.62; transition:opacity .35s; }\n.stage.charging canvas{ opacity:1; }\n.af-cross{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }\n.af-cross svg{ position:absolute; width:74px; height:74px; transform:rotate(-90deg); }\n.af-ring{ fill:none; stroke:var(--ink); stroke-width:2.5; opacity:.9; }\n.af-cross i{ width:18px; height:18px; position:relative; }\n.af-cross i::before,.af-cross i::after{ content:\"\"; position:absolute; background:var(--ink); }\n.af-cross i::before{ left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }\n.af-cross i::after{ top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }\n.af-wipe{ position:absolute; inset:0; background:#faf9f6; opacity:0; pointer-events:none; }\n.stage.revealed .af-cross i{ opacity:.25; }\n\n/* simultaneous contrast */\n.cf-wrap{ display:flex; flex-direction:column; gap:18px; }\n.cfield{ position:relative; width:100%; height:min(46vh,360px); border:1px solid var(--hair); overflow:hidden; touch-action:none; cursor:ew-resize;\n  background:linear-gradient(90deg,#2b2b2b 0 50%,#e4e2dc 50% 100%); }\n.cf-bar{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); height:18%; background:#808080;\n  display:flex; align-items:center; justify-content:center; }\n.cf-bar span{ font-size:11px; color:#1a1a1a; mix-blend-mode:normal; letter-spacing:.1em; }\n.cf-handle{ position:absolute; top:0; bottom:0; width:2px; background:var(--paper); transform:translateX(-50%); cursor:ew-resize; }\n.cf-handle i{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:18px; height:18px; background:var(--paper); border:2px solid var(--ink); border-radius:50%; }\n.cf-perceived{ display:flex; align-items:center; justify-content:space-between; gap:14px;\n  font-family:var(--mono); font-size:12px; color:var(--grey); }\n.cf-perceived span{ color:var(--ink); text-transform:uppercase; letter-spacing:.08em; }\n.cf-perceived i{ font-style:normal; text-align:center; flex:1; }\n.cf-perceived b{ color:var(--ink); }\n\n/* operator console */\n.console{ display:grid; grid-template-columns:1.25fr .75fr; align-items:stretch; gap:0;\n  padding-top:var(--bar); }\n@media (max-width:880px){ .console{ grid-template-columns:1fr; } }\n.op-stage{ position:relative; min-height:100svh; }\n@media (max-width:880px){ .op-stage{ min-height:58svh; } }\n.op-stage canvas{ position:absolute; inset:0; width:100%; height:100%; }\n.op-panel{ padding:clamp(22px,3vw,40px); border-left:1px solid var(--hair); display:flex; flex-direction:column; justify-content:center; gap:6px;\n  background:var(--paper); }\n@media (max-width:880px){ .op-panel{ border-left:none; border-top:1px solid var(--hair); min-height:auto; } }\n.op-panel .title .emergent{ height:clamp(34px,5vw,52px); }\n.op-panel .mech{ font-size:14px; line-height:1.5; margin:6px 0 22px; color:#2a2926; }\n.sliders{ display:flex; flex-direction:column; gap:16px; margin-bottom:24px; }\n.sliders label{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px 14px; }\n.sliders label span{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); }\n.sliders label output{ font-family:var(--mono); font-size:12px; text-align:right; min-width:6ch; }\n.sliders label input[type=range]{ grid-column:1 / -1; width:100%; }\n\n/* ── colophon ───────────────────────────────────────────────────────────── */\n.colophon{ min-height:80svh; display:flex; align-items:center; padding:8vh clamp(20px,6vw,90px); border-top:1px solid var(--hair); scroll-snap-align:start; }\n.co-in{ max-width:680px; }\n.co-in .big{ font-size:clamp(40px,7vw,90px); font-weight:800; letter-spacing:-.03em; line-height:.95; margin:0 0 30px; }\n.co-note{ font-size:clamp(16px,1.7vw,21px); line-height:1.5; color:#2a2926; margin:0 0 36px; text-wrap:pretty; }\n.fine{ font-size:11px; letter-spacing:.08em; color:var(--grey); line-height:1.9; }\n\n/* ── tweaks panel ───────────────────────────────────────────────────────── */\n.tweaks{\n  position:fixed; right:16px; bottom:16px; z-index:80; width:288px;\n  background:var(--paper); border:1px solid var(--ink); border-radius:2px;\n  box-shadow:0 20px 60px rgba(0,0,0,.22); font-family:var(--sans);\n}\n.tweaks[hidden]{ display:none; }\n.tweaks header{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--hair); }\n.tweaks header span{ font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; }\n.tw-x{ background:none; border:none; font-size:20px; line-height:1; cursor:pointer; color:var(--ink); padding:0 4px; }\n.tw-body{ padding:14px; }\n.tw-sec{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey); margin:16px 0 8px; }\n.tw-sec:first-child{ margin-top:0; }\n.seg{ display:flex; border:1px solid var(--ink); border-radius:1px; overflow:hidden; }\n.seg button{ flex:1; background:var(--paper); border:none; border-right:1px solid var(--hair); color:var(--ink);\n  font-family:var(--mono); font-size:11px; padding:9px 4px; cursor:pointer; transition:.14s; letter-spacing:.02em; }\n.seg button:last-child{ border-right:none; }\n.seg button:hover{ background:color-mix(in srgb,var(--ink) 8%,var(--paper)); }\n.seg button.on{ background:var(--ink); color:var(--paper); }\n.tw-slider{ display:flex; align-items:center; gap:12px; }\n.tw-slider input[type=range]{ flex:1; }\n.tw-slider output{ font-family:var(--mono); font-size:12px; width:4ch; text-align:right; }\n.tw-note{ font-family:var(--mono); font-size:10.5px; color:var(--grey); margin:8px 0 0; line-height:1.5; }\n.tw-toggle{ display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; margin-top:10px; }\n.tw-toggle input{ position:absolute; opacity:0; }\n.tw-toggle span{ width:34px; height:18px; border:1px solid var(--ink); border-radius:20px; position:relative; flex:none; transition:.16s; }\n.tw-toggle span::after{ content:\"\"; position:absolute; top:2px; left:2px; width:12px; height:12px; background:var(--ink); border-radius:50%; transition:.16s; }\n.tw-toggle input:checked + span{ background:var(--ink); }\n.tw-toggle input:checked + span::after{ left:18px; background:var(--paper); }\n.tw-toggle i{ font-style:normal; color:var(--grey); font-size:11px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ── chrome ───────────────────────────────────────────────────────────── -->\n<div class=\"topbar\">\n  <a class=\"brand\" href=\"#hero\">\n    <b>OP.<\u002Fb><span>a study in perception<\u002Fspan>\n  <\u002Fa>\n  <div class=\"ops\">\n    <div class=\"dial\">\n      <label for=\"dial\">intensity<\u002Flabel>\n      <input id=\"dial\" type=\"range\" min=\"0\" max=\"100\" data-dial=\"\">\n      <output data-dial-out=\"\">30<\u002Foutput>\n    <\u002Fdiv>\n    <button class=\"calm\" data-calm=\"\">calm mode<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<nav class=\"idx\" aria-label=\"rooms\"><\u002Fnav>\n\n<div class=\"rm-banner\" data-rm=\"\" hidden=\"\">reduced-motion respected · every field is held still<\u002Fdiv>\n\n<main>\n\n  <!-- ── 00 · entrance (calm) ──────────────────────────────────────────── -->\n  <section id=\"hero\" class=\"hero\" data-room=\"entrance\" data-n=\"00\">\n    <div class=\"hero-in\">\n      <div class=\"kicker\">optical art · Riley › Vasarely › Cruz-Diez<\u002Fdiv>\n      <div class=\"hero-title\" data-title=\"OP\" data-size=\"320\" data-level=\"1\"><\u002Fdiv>\n      <p class=\"thesis\">The screen is not the artwork.<br>The viewer's visual system is.<\u002Fp>\n      <p class=\"lede\">Op&nbsp;Art has no meaning to subvert — it operates one layer lower, on\n        perception itself. The artwork is not the marks on the surface; it is the event\n        that happens in your eye and visual cortex. The pages below are perfectly still.\n        Everything that moves, moves in you.<\u002Fp>\n      <div class=\"care\">\n        <span class=\"dot\"><\u002Fspan>\n        <p>High-contrast fields can cause real eye-strain — and, rarely, photosensitive\n          response. Nothing here flashes. Intensity begins gentle and only rises when\n          <em>you<\u002Fem> raise it, top-right. A calm mode eases every field at any time.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"scrollcue\"><span>enter<\u002Fspan><i><\u002Fi><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 01 · live moiré ───────────────────────────────────────────────── -->\n  <section id=\"moire\" class=\"station fullbleed\" data-room=\"moiré\" data-n=\"01\">\n    <canvas><\u002Fcanvas>\n    <div class=\"label bl\">\n      <div class=\"no\">01 / moiré · kinetic<\u002Fdiv>\n      <div class=\"title\" data-title=\"MOIRÉ\" data-size=\"120\"><\u002Fdiv>\n      <p class=\"plain-title\">Moiré<\u002Fp>\n      <p class=\"mech\">two ring-fields, one bound to your cursor. their overlap is genuine\n        interference — not animation.<\u002Fp>\n      <p class=\"quote\">“The user's body completes the work, exactly as in a gallery — except\n        now the canvas reads you back.”<\u002Fp>\n      <div class=\"row\">\n        <button class=\"ctl\" data-mo-tilt=\"\">enable tilt<\u002Fbutton>\n        <span class=\"read mono\" data-mo-read=\"\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 02 · afterimage ───────────────────────────────────────────────── -->\n  <section id=\"after\" class=\"station split\" data-room=\"afterimage\" data-n=\"02\">\n    <div class=\"af-wrap\">\n      <div class=\"stage\" data-af-stage=\"\">\n        <canvas><\u002Fcanvas>\n        <div class=\"af-cross\" data-af-cross=\"\">\n          <svg viewBox=\"0 0 100 100\"><circle class=\"af-ring\" data-af-ring=\"\" cx=\"50\" cy=\"50\" r=\"46\"><\u002Fcircle><\u002Fsvg>\n          <i><\u002Fi>\n        <\u002Fdiv>\n        <div class=\"af-wipe\" data-af-wipe=\"\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"label\">\n      <div class=\"no\">02 / afterimage · retinal<\u002Fdiv>\n      <div class=\"title\" data-title=\"GHOST\" data-size=\"120\"><\u002Fdiv>\n      <p class=\"plain-title\">Ghost<\u002Fp>\n      <p class=\"mech\">fix your gaze on the cross. the field charges your retina, then wipes\n        to blank — and your own eye paints the complementary ghost.<\u002Fp>\n      <p class=\"quote\">“The content appears inside your eye, on a literally blank page. You\n        can't get more Op-on-the-web than that.”<\u002Fp>\n      <div class=\"row\">\n        <button class=\"ctl big\" data-af-btn=\"\">begin · 8s<\u002Fbutton>\n      <\u002Fdiv>\n      <p class=\"status mono\" data-af-status=\"\">fix your gaze on the cross and hold it<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 03 · simultaneous contrast ────────────────────────────────────── -->\n  <section id=\"contrast\" class=\"station split\" data-room=\"contrast\" data-n=\"03\">\n    <div class=\"cf-wrap\">\n      <div class=\"cfield\" data-cf-field=\"\">\n        <div class=\"cf-bar\"><span class=\"mono\">#808080<\u002Fspan><\u002Fdiv>\n        <div class=\"cf-handle\" data-cf-handle=\"\"><i><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cf-perceived\" data-cf-perceived=\"\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"label\">\n      <div class=\"no\">03 / simultaneous contrast · Albers<\u002Fdiv>\n      <div class=\"title\" data-title=\"THE LIAR\" data-size=\"92\"><\u002Fdiv>\n      <p class=\"plain-title\">The Liar<\u002Fp>\n      <p class=\"mech\">one uniform grey bar. drag the colour seam beneath it — its apparent\n        hue washes warm↔cool while the hex never changes.<\u002Fp>\n      <p class=\"quote\">“A rhyme with the treachery of signs — but here the eye is the liar,\n        not the label.”<\u002Fp>\n      <div class=\"row\">\n        <button class=\"ctl\" data-cf-prove=\"\">prove it<\u002Fbutton>\n        <span class=\"read mono\">hold to flatten both fields to #808080<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 04 · figure / ground ──────────────────────────────────────────── -->\n  <section id=\"vega\" class=\"station fullbleed\" data-room=\"figure / ground\" data-n=\"04\">\n    <canvas><\u002Fcanvas>\n    <div class=\"label tr\">\n      <div class=\"no\">04 / figure–ground · Vega<\u002Fdiv>\n      <div class=\"title\" data-title=\"VEGA\" data-size=\"120\"><\u002Fdiv>\n      <p class=\"plain-title\">Vega<\u002Fp>\n      <p class=\"mech\">a flat grid swells into spheres. hover one — the bulge inverts into a\n        well.<\u002Fp>\n      <p class=\"quote\">“The page reads as a heaving surface with no actual depth at all.”<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 05 · the operator ─────────────────────────────────────────────── -->\n  <section id=\"operator\" class=\"station console\" data-room=\"the operator\" data-n=\"05\">\n    <div class=\"op-stage\"><canvas><\u002Fcanvas><\u002Fdiv>\n    <div class=\"op-panel\">\n      <div class=\"no\">05 / plastic alphabet · operator<\u002Fdiv>\n      <div class=\"title\" data-title=\"OPERATOR\" data-size=\"64\"><\u002Fdiv>\n      <p class=\"plain-title\">Operator<\u002Fp>\n      <p class=\"mech\">Vasarely's reproducible units — generative art, decades early. the\n        whole composition regenerates as you move the controls. you are the operator.<\u002Fp>\n      <div class=\"sliders\">\n        <label><span>frequency<\u002Fspan><input type=\"range\" min=\"0.4\" max=\"7\" step=\"0.1\" data-pp=\"freq\"><output><\u002Foutput><\u002Flabel>\n        <label><span>amplitude<\u002Fspan><input type=\"range\" min=\"0\" max=\"100\" data-pp=\"amp\"><output><\u002Foutput><\u002Flabel>\n        <label><span>contrast<\u002Fspan><input type=\"range\" min=\"0\" max=\"100\" data-pp=\"contrast\"><output><\u002Foutput><\u002Flabel>\n        <label><span>grid skew<\u002Fspan><input type=\"range\" min=\"-70\" max=\"70\" data-pp=\"skew\"><output><\u002Foutput><\u002Flabel>\n        <label><span>hue rotation<\u002Fspan><input type=\"range\" min=\"0\" max=\"360\" data-pp=\"hue\"><output><\u002Foutput><\u002Flabel>\n      <\u002Fdiv>\n      <button class=\"ctl\" data-pp-rnd=\"\">regenerate ↻<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── colophon ──────────────────────────────────────────────────────── -->\n  <footer class=\"colophon\">\n    <div class=\"co-in\">\n      <p class=\"big\">It's all retina.<\u002Fp>\n      <p class=\"co-note\">The surrealist site haunts you with meaning that won't resolve. The\n        Op&nbsp;Art site hands you pure sensation that refuses to mean anything at all —\n        it insists there is nothing beneath the surface.<\u002Fp>\n      <p class=\"mono fine\">five perceptual mechanisms · no flicker in 3–30&nbsp;Hz · calm mode\n        + prefers-reduced-motion honoured · built as still images that move only in you<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fmain>\n\n<script src=\"e06141a7-7bde-4d5b-8e67-c4fbcb1e9f81\"><\u002Fscript>\n<script src=\"a5226efd-5d71-4369-802a-648f5d554458\"><\u002Fscript>\n<script src=\"dbf88bcf-ce57-4edd-a86d-6c38108c1d5f\"><\u002Fscript>\n<script src=\"90c52675-bbda-453f-905f-149c9ee8c3ea\"><\u002Fscript>\n<script src=\"f23ee17a-f134-4f35-a89f-81f3163435bd\"><\u002Fscript>\n<script src=\"12f16319-d7e9-44f9-b3a8-b4c4eff6862a\"><\u002Fscript>\n<script src=\"6ae48434-c889-4322-8e45-bebbda739d02\"><\u002Fscript>\n<script src=\"ea7ee2e6-f515-45dd-bc20-310ede7049ac\"><\u002Fscript>\n\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
